[package]
name = "bsafe"
version = "0.1.0"
description = "BSafe - Multisig wallet with digital inheritance on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bsafe"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Devnet demo build: timer minimums in minutes instead of days (see create_plan.rs)
demo-timers = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

