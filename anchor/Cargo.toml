[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
# Optimize for size: keeps the .so within the deployed program's allocated length,
# so devnet upgrades don't need an `extend` (and less buffer rent).
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
