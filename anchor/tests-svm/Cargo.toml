[package]
name = "bsafe-svm-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate: tests load the compiled target/deploy/bsafe.so into LiteSVM,
# so they exercise the exact binary that gets deployed.
[workspace]

[dependencies]
# Versions pinned to the ones litesvm 0.17 uses, so types line up.
litesvm = "0.17"
sha2 = "0.10"
solana-account = "4"
solana-address = "2"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-rent = "~4.4"
solana-signer = "3"
solana-transaction = "4"
